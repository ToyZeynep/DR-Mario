# ETKİNLEŞTİRMEK İÇİN bu dosya .github/workflows/ios-build.yml konumuna kopyalanmalı (bkz. tools/README.md).
# iOS derlemesi + simülatörde ekran görüntüleri (Mac olmadan derleme denetimi için).
name: iOS build

on:
  push:
    paths: ["DR. Mario/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build (simulator, Debug)
        run: |
          set -o pipefail
          xcodebuild -project "DR. Mario/DR. Mario.xcodeproj" -target "DR. Mario" -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" | grep -v "appintents" | head -300

      - name: Build (device, Release, imzasız)
        run: |
          set -o pipefail
          xcodebuild -project "DR. Mario/DR. Mario.xcodeproj" -target "DR. Mario" -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build-release" CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" | head -100

      - name: Screenshots
        run: |
          APP=$(find build -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][-1])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for s in setup title level cpu-level single cpu settings help lobby; do
            xcrun simctl terminate "$UDID" com.zeynep.DR.Mario || true
            xcrun simctl launch "$UDID" com.zeynep.DR.Mario -vhShot "$s" -AppleLanguages "(tr)"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
          done
          xcrun simctl terminate "$UDID" com.zeynep.DR.Mario || true
          xcrun simctl launch "$UDID" com.zeynep.DR.Mario -vhShot title -AppleLanguages "(en)"
          sleep 6
          xcrun simctl io "$UDID" screenshot "shots/title-en.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            build.log
            shots/
